services:
  # NOTE: ./db/init runs only on first-init of an empty volume. For existing
  # volumes and all managed deploys, apply schema via: python -m pipeline.migrate apply
  postgres:
    image: postgis/postgis:15-3.4
    # postgis/postgis:15-3.4 is amd64-only; Apple Silicon must run via emulation
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel_user
      POSTGRES_PASSWORD: sentinel_pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel_user} -d ${POSTGRES_DB:-sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:1.22.0-p0
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-sentinel_user}:${POSTGRES_PASSWORD:-sentinel_pass}@postgres:5432/${POSTGRES_DB:-sentinel}"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "100"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: scram-sha-256
      # Pooled clients send `-c statement_timeout=...` in startup options; transaction-mode
      # PgBouncer rejects unknown startup params unless told to ignore them.
      IGNORE_STARTUP_PARAMETERS: statement_timeout
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${POSTGRES_USER:-sentinel_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: { context: ., dockerfile: docker/Dockerfile }
    env_file: [sentinel.env]
    environment: { PGHOST: pgbouncer, PGPORT: "5432", PGPASSWORD: "${POSTGRES_PASSWORD:-sentinel_pass}", REDIS_URL: "redis://redis:6379" }
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    depends_on:
      redis: { condition: service_healthy }
      pgbouncer: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  ingestion-worker:
    build: { context: ., dockerfile: docker/Dockerfile }
    env_file: [sentinel.env]
    environment: { PGHOST: pgbouncer, PGPORT: "5432", PGPASSWORD: "${POSTGRES_PASSWORD:-sentinel_pass}", REDIS_URL: "redis://redis:6379" }
    command: ["python", "-m", "pipeline.workers.ingestion_worker"]
    depends_on: { redis: { condition: service_healthy }, pgbouncer: { condition: service_started } }

  gridcell-worker:
    build: { context: ., dockerfile: docker/Dockerfile }
    env_file: [sentinel.env]
    environment: { PGHOST: pgbouncer, PGPORT: "5432", PGPASSWORD: "${POSTGRES_PASSWORD:-sentinel_pass}", REDIS_URL: "redis://redis:6379" }
    command: ["python", "-m", "pipeline.workers.gridcell_worker"]
    depends_on: { redis: { condition: service_healthy }, pgbouncer: { condition: service_started } }

  clustering-worker:
    build: { context: ., dockerfile: docker/Dockerfile }
    env_file: [sentinel.env]
    environment: { PGHOST: pgbouncer, PGPORT: "5432", PGPASSWORD: "${POSTGRES_PASSWORD:-sentinel_pass}", REDIS_URL: "redis://redis:6379" }
    command: ["python", "-m", "pipeline.workers.clustering_worker"]
    depends_on: { redis: { condition: service_healthy }, pgbouncer: { condition: service_started } }

  consensus-worker:
    build: { context: ., dockerfile: docker/Dockerfile }
    env_file: [sentinel.env]
    environment: { PGHOST: pgbouncer, PGPORT: "5432", PGPASSWORD: "${POSTGRES_PASSWORD:-sentinel_pass}", REDIS_URL: "redis://redis:6379" }
    command: ["python", "-m", "pipeline.workers.consensus_worker"]
    depends_on: { redis: { condition: service_healthy }, pgbouncer: { condition: service_started } }
    # HF model cache (NLI + relevance embedder) persists across container
    # recreations; otherwise both re-download on every restart.
    volumes:
      - hf-cache:/root/.cache/huggingface

  llm-worker:
    build: { context: ., dockerfile: docker/Dockerfile }
    env_file: [sentinel.env]
    environment: { PGHOST: pgbouncer, PGPORT: "5432", PGPASSWORD: "${POSTGRES_PASSWORD:-sentinel_pass}", REDIS_URL: "redis://redis:6379" }
    command: ["python", "-m", "pipeline.workers.llm_worker"]
    depends_on: { redis: { condition: service_healthy }, pgbouncer: { condition: service_started } }
    volumes:
      - hf-cache:/root/.cache/huggingface

  frontend-next:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: "http://localhost:8000"
        NEXT_PUBLIC_MAP_STYLE: "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json"
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  hf-cache: