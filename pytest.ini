[pytest]
pythonpath = .
addopts = -m "not destructive"
markers =
    destructive: wipes whole tables (events/hotspots/grid_cells/event_hotspot); deselected by default so it can never clobber a real DB. Opt in with -m destructive.
    gkg: test exercises the GKG enrichment path and needs SENTINEL_GKG_ENABLED=true (default in production, off by default in tests).
    relevance: test exercises the FR-26 relevance gate and needs SENTINEL_RELEVANCE_ENABLED=true (default in production, off by default in tests).
    slow: test takes more than ~5 s, usually because it downloads or runs a real model.
