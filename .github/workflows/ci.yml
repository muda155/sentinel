name: CI
on:
  pull_request:
  push: { branches: [main] }

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env: { POSTGRES_DB: sentinel, POSTGRES_USER: sentinel_user, POSTGRES_PASSWORD: sentinel_pass }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel_user -d sentinel"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      SENTINEL_TEST_DB: "host=127.0.0.1 port=5433 dbname=sentinel user=sentinel_user password=sentinel_pass"
      PGHOST: 127.0.0.1
      PGPORT: "5433"
      PGDATABASE: sentinel
      PGUSER: sentinel_user
      PGPASSWORD: sentinel_pass
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - run: pip install -r requirements.txt
      - name: Apply DB schema
        run: |
          for f in db/init/*.sql; do
            PGPASSWORD=sentinel_pass psql -h 127.0.0.1 -p 5433 -U sentinel_user -d sentinel -f "$f" || true
          done
          python -m pipeline.migrate baseline 12 || true
          python -m pipeline.migrate apply
      - name: Lint
        run: ruff check pipeline api tests
      - name: Tests
        run: pytest tests/ -q
